<a class="app-shell__evitement" href="#contenu">Aller au contenu</a>

<header class="app-shell__entete">
  <a class="app-shell__nom" routerLink="/">Qui a voté quoi ?</a>
  <nav class="app-shell__nav" aria-label="Principal">
    <a routerLink="/">Lois</a>
    <a routerLink="/deputes">Députés</a>
  </nav>
  <app-search
    class="app-shell__recherche"
    [index]="index()"
    (besoinIndex)="besoinIndex.emit()"
  />
  <button
    fdIconButton
    class="app-shell__bascule"
    label="Thème sombre"
    [pressed]="sombre()"
    (click)="theme.toggle()"
  >
    <svg class="app-shell__lune" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
    </svg>
  </button>
</header>

<main id="contenu" class="app-shell__contenu">
  <router-outlet />
</main>

<footer class="app-shell__pied">
  <p class="caption">
    Données : data.gouv.fr (NosParlementaires, Datan), d'après l'open data de l'Assemblée
    nationale (Licence Ouverte 2.0).
    <a routerLink="/a-propos">À propos</a>
  </p>
  @if (miseAJour(); as date) {
    <p class="caption">Données mises à jour le {{ dateLongue(date) }}</p>
  }
</footer>
