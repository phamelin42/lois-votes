<span class="app-group-pill caption" [attr.title]="groupe().libelle">
  <span
    class="app-group-pill__dot"
    aria-hidden="true"
    [style.background-color]="groupe().couleur"
  ></span>
  <span class="app-group-pill__abrege">{{ groupe().abrege }}</span>
  <span class="app-group-pill__libelle">{{ groupe().libelle }}</span>
</span>
