<div class="app-vote-bar" [class.app-vote-bar--sm]="taille() === 'sm'">
  <div class="app-vote-bar__barre" role="img" [attr.aria-label]="resume()">
    @for (segment of segments(); track segment.type) {
      @if (segment.nombre > 0) {
        <span
          class="app-vote-bar__segment app-vote-bar__segment--{{ segment.type }}"
          [style.flex-grow]="segment.nombre"
        ></span>
      }
    }
  </div>
  <p class="app-vote-bar__chiffres caption" aria-hidden="true">{{ pourcentages() }}</p>
  @if (nonVotants(); as nonVotants) {
    <p class="app-vote-bar__absents caption" aria-hidden="true">{{ nonVotants.texte }}</p>
  }
</div>
