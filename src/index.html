<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Qui a voté quoi ?</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F5B1C5" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/media/zen-maru-gothic-latin-500-normal.woff2"
      crossorigin
    />
    <script>
      // Thème Nuit choisi par l'utilisateur : posé avant le rendu, pour éviter le flash du thème Jour.
      try {
        if (localStorage['fuda-theme'] === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch {
        // Stockage indisponible (navigation privée, données bloquées) : on reste en Jour.
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
